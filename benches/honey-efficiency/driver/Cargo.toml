[package]
name = "cigar-honey-efficiency-driver"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cigar-protocol = { path = "../../../crates/cigar-protocol" }
cigar-store = { path = "../../../crates/cigar-store" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
