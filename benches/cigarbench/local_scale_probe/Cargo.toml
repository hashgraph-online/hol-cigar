[package]
name = "cigar-local-scale-record-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ciborium = "=0.2.2"
cigar-protocol = { path = "../../../crates/cigar-protocol" }
cigar-testkit = { path = "../../../crates/cigar-testkit" }
serde = "=1.0.228"
serde_json = "=1.0.150"

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
