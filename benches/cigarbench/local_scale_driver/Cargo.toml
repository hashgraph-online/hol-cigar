[package]
name = "cigar-local-scale-driver"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cigar-crypto = { path = "../../../crates/cigar-crypto" }
cigar-protocol = { path = "../../../crates/cigar-protocol" }
cigar-store = { path = "../../../crates/cigar-store" }
getrandom = "=0.4.3"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
