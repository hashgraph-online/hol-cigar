[package]
name = "cigar-reliability-compile-driver"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cigar-compiler = { path = "../../../crates/cigar-compiler" }
cigar-policy = { path = "../../../crates/cigar-policy" }
cigar-protocol = { path = "../../../crates/cigar-protocol" }
cigar-retrieval = { path = "../../../crates/cigar-retrieval" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
