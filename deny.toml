[advisories]
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Exact compatibility lines required by the audited SQLite, Argon2id, native
# credential-store, Wasmtime, rustls, and reqwest dependency graphs. All other
# duplicate versions remain denied.
skip = [
  { name = "block-buffer", version = "=0.10.4" },
  { name = "cipher", version = "=0.4.4" },
  { name = "const-oid", version = "=0.9.6" },
  { name = "cpufeatures", version = "=0.2.17" },
  { name = "crypto-common", version = "=0.1.7" },
  { name = "digest", version = "=0.10.7" },
  { name = "foldhash", version = "=0.1.5" },
  { name = "fallible-iterator", version = "=0.2.0" },
  { name = "getrandom", version = "=0.2.17" },
  { name = "getrandom", version = "=0.3.4" },
  { name = "hashbrown", version = "=0.15.5" },
  { name = "hashbrown", version = "=0.16.1" },
  { name = "hashbrown", version = "=0.14.5" },
  { name = "hmac", version = "=0.12.1" },
  { name = "io-lifetimes", version = "=2.0.4" },
  { name = "inout", version = "=0.1.4" },
  { name = "r-efi", version = "=5.3.0" },
  { name = "rand_core", version = "=0.6.4" },
  { name = "rand_core", version = "=0.9.5" },
  { name = "rand", version = "=0.9.5" },
  { name = "sha2", version = "=0.10.9" },
  { name = "tower-http", version = "=0.6.11" },
  { name = "wasi", version = "=0.11.1+wasi-snapshot-preview1" },
  { name = "windows-sys", version = "=0.52.0" },
  # Windows-only transitive compatibility split: sysinfo's windows 0.61 line
  # still requires windows-link 0.1 while the current windows-sys/reqwest graph
  # requires 0.2. Neither crate is linked into the macOS release cohort.
  { name = "windows-link", version = "=0.1.3" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  # Mozilla-derived public root-certificate data used by the platform-verifying
  # HTTPS JWKS client; this exception does not admit CDLA for executable code.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
  # Mozilla root data used by the certificate-verifying PostgreSQL client.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
  # Transitive rust-s3 HTTP implementation; MPL obligations are tracked in release notices.
  { allow = ["MPL-2.0"], crate = "attohttpc" },
  # Public-domain-compatible hash implementation used by rust-s3 configuration parsing.
  { allow = ["CC0-1.0"], crate = "tiny-keccak" },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
