[package]
name = "cigar-cli"
description = "CIGAR command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["full"]
full = [
  "dep:base64",
  "dep:cigar-api",
  "dep:cigar-crypto",
  "dep:cigar-daemon",
  "dep:cigar-effects",
  "dep:cigar-policy",
  "dep:cigar-protocol",
  "dep:cigar-store",
  "dep:reqwest",
  "dep:rustls",
  "dep:sha2",
  "tokio/process",
]
beta-embedded = []
migration-fault-injection = ["full", "cigar-store/migration-fault-injection"]

[dependencies]
cigar-api = { workspace = true, optional = true }
cigar-canon.workspace = true
cap-std.workspace = true
cigar-crypto = { workspace = true, optional = true }
cigar-daemon = { path = "../cigar-daemon", version = "=0.9.2", optional = true }
cigar-effects = { path = "../cigar-effects", version = "=0.9.2", optional = true }
cigar-policy = { workspace = true, optional = true }
cigar-protocol = { workspace = true, optional = true }
cigar-store = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
getrandom.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { version = "=1.52.3", default-features = false, features = ["macros", "rt", "signal", "sync", "time"] }
toml.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[lints]
workspace = true

[[bin]]
name = "cigar"
path = "src/main.rs"
