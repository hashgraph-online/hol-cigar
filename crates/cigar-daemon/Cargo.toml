[package]
name = "cigar-daemon"
description = "CIGAR daemon composition binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "LICENSE", "NOTICE", "release.json"]

[dependencies]
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
cigar-api = { version = "=0.9.0-honey.1", path = "../cigar-api" }
cigar-canon.workspace = true
cigar-catalog.workspace = true
cigar-code-intel.workspace = true
cigar-compiler = { version = "=0.9.0-honey.1", path = "../cigar-compiler" }
cigar-crypto.workspace = true
cigar-effects = { version = "=0.9.0-honey.1", path = "../cigar-effects" }
cigar-observe.workspace = true
cigar-policy.workspace = true
cigar-protocol.workspace = true
cigar-replay = { version = "=0.9.0-honey.1", path = "../cigar-replay" }
cigar-retrieval.workspace = true
cigar-space = { version = "=0.9.0-honey.1", path = "../cigar-space" }
cigar-store.workspace = true
getrandom.workspace = true
futures-core.workspace = true
hmac.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true
tower.workspace = true
tower-http.workspace = true
x509-parser.workspace = true
zeroize.workspace = true
sysinfo = "=0.37.2"

[target.'cfg(windows)'.dependencies]
cigar-windows-ipc = { version = "=0.9.0-honey.1", path = "../cigar-windows-ipc" }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
cigar-testkit.workspace = true
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic", "metrics", "trace"] }
rcgen = { version = "=0.14.8", default-features = false, features = ["pem", "ring"] }
tempfile.workspace = true

[lints]
workspace = true

[features]
experimental-profiles = []

[[bin]]
name = "cigard"
path = "src/main.rs"
