[package]
name = "cigar-retrieval"
description = "Authorized deterministic CIGAR retrieval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "LICENSE", "NOTICE", "release.json"]

[features]
experimental-profiles = []

[lints]
workspace = true

[dependencies]
cigar-policy.workspace = true
cigar-protocol.workspace = true
cigar-store.workspace = true
sha2.workspace = true

[dev-dependencies]
cigar-testkit.workspace = true
proptest = "=1.11.0"
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
getrandom.workspace = true
rustix = { workspace = true, features = ["fs"] }
