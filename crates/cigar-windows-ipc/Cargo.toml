[package]
name = "cigar-windows-ipc"
description = "Audited Windows local IPC and credential ACL adapter for CIGAR"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "LICENSE", "NOTICE", "release.json"]

[features]
default = ["named-pipe"]
named-pipe = ["dep:tokio"]

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.53.3", optional = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_IO", "Win32_System_Ioctl"] }

[lints.rust]
missing_docs = "deny"
warnings = "deny"
# The PRD permits unsafe Rust only in an explicitly audited platform adapter. Every unsafe block
# in this crate is paired with a local safety proof and the public surface remains safe.
unsafe_code = "allow"

[lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
