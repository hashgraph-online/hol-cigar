[package]
name = "cigar-aws-creds"
version = "0.39.1-cigar.1"
edition = "2021"
rust-version = "1.92"
authors = ["Drazen Urch", "CIGAR contributors"]
description = "Security-reviewed CIGAR distribution of the aws-creds support library"
license = "MIT"
repository = "https://github.com/CIGAR/cigar"
homepage = "https://hol.org/cigar"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE", "CIGAR-PATCHES.md", "release.json"]

[features]
default = ["rustls-tls"]
http-credentials = ["dep:attohttpc"]
native-tls = ["http-credentials", "attohttpc/tls"]
native-tls-vendored = ["http-credentials", "attohttpc/tls-vendored"]
rustls-tls = ["http-credentials", "attohttpc/tls-rustls-webpki-roots-ring"]

[lib]
name = "awscreds"
path = "src/lib.rs"

[dependencies]
home = "0.5"
log = "0.4"
rust-ini = "0.21"
thiserror = "2"
url = "2"

[dependencies.attohttpc]
version = "=0.30.1"
features = ["json"]
optional = true
default-features = false

[dependencies.quick-xml]
version = "=0.41.0"
features = ["serialize"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.time]
version = "0.3.6"
features = ["serde", "serde-well-known"]

[dev-dependencies]
env_logger = "0.11"
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
