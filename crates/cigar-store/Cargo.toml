[package]
name = "cigar-store"
description = "Transactional CIGAR repository contracts and storage profiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = ["crates-io"]
include = ["src/**", "migrations/**", "Cargo.toml", "LICENSE", "NOTICE", "release.json"]

[lints]
workspace = true

[features]
migration-fault-injection = []
projection-fault-injection = []

[dependencies]
ciborium.workspace = true
cigar-crypto.workspace = true
cigar-protocol.workspace = true
fallible-iterator.workspace = true
hmac.workspace = true
postgres.workspace = true
r2d2.workspace = true
r2d2_postgres.workspace = true
s3.workspace = true
rustls.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio-postgres-rustls.workspace = true
url = "=2.5.8"
webpki-roots.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
cigar-testkit.workspace = true
rcgen = { version = "=0.14.8", default-features = false, features = ["pem", "ring"] }
serde.workspace = true
