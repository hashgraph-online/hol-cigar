[package]
name = "hol-cigar"
version = "0.14.2"
description = "Open-source context engineering protocol for AI agents: governed retrieval, bounded multi-agent handoffs, MCP, provenance, recoverable effects, and replay."
edition.workspace = true
# Below the workspace toolchain so applications on an older stable Rust can
# depend on this crate.
rust-version = "1.89"
license.workspace = true
repository = "https://github.com/hashgraph-online/hol-cigar"
homepage = "https://hol.org/cigar"
documentation = "https://docs.rs/hol-cigar"
readme = "README.md"
publish = ["crates-io"]
keywords = ["ai-agents", "context-engineering", "llm", "rag", "retrieval"]
categories = ["text-processing", "data-structures"]
include = ["build.rs", "src/**", "tests/**", "examples/**", "fixtures/**", "README.md", "CHANGELOG.md", "LICENSE", "LICENSE.tiktoken", "Cargo.toml"]

[package.metadata.docs.rs]
features = ["bpe"]

[lints]
workspace = true

[lib]
name = "hol_cigar"
path = "src/lib.rs"

[features]
default = []
bpe = ["dep:tiktoken-rs", "dep:regex-automata"]
broker = ["dep:getrandom", "dep:hmac", "dep:zeroize"]
broker-persistence = ["broker", "dep:rusqlite", "dep:rustix", "dep:hol-cigar-windows-ipc"]

[dependencies]
# Caret requirements so applications can share these crates with their own
# dependencies; this repository's Cargo.lock still pins the exact versions.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
getrandom = { version = "0.4.3", optional = true }
hmac = { version = "0.13.0", optional = true }
zeroize = { version = "1.9.0", optional = true }
tiktoken-rs = { version = "0.12.0", optional = true }
regex-automata = { version = "0.4.15", optional = true }
rusqlite = { version = "0.41.1", optional = true, features = ["backup", "bundled", "limits"] }
rustix = { version = "1.1.6", optional = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
hol-cigar-windows-ipc = { version = "=0.9.4", path = "../cigar-windows-ipc", optional = true, default-features = false }

[dev-dependencies]
tempfile.workspace = true
base64.workspace = true
fancy-regex = "=0.17.0"

[build-dependencies]
base64 = "0.22.1"
sha2 = "0.11.0"
regex-automata = "0.4.15"

[[bin]]
name = "cigar-context"
path = "src/main.rs"
required-features = ["bpe"]

[[example]]
name = "compare"
required-features = ["bpe"]

[[bin]]
name = "cigar-context-worker"
path = "src/worker.rs"
required-features = ["bpe"]

[[example]]
name = "source_compare"
required-features = ["bpe"]
