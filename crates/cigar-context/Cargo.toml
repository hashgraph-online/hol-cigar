[package]
name = "cigar-context"
version = "0.14.0"
description = "Incremental, token-budgeted local context graphs with citations and verified deltas"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/hashgraph-online/hol-cigar"
readme = "README.md"
publish = ["crates-io"]
keywords = ["context", "retrieval", "graph", "tokens", "rag"]
categories = ["text-processing", "data-structures"]
include = ["src/**", "tests/**", "examples/**", "fixtures/**", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[package.metadata.docs.rs]
features = ["bpe"]

[lints]
workspace = true

[features]
default = []
bpe = ["dep:tiktoken-rs"]
broker = ["dep:getrandom", "dep:hmac", "dep:zeroize"]
broker-persistence = ["broker", "dep:rusqlite", "dep:rustix", "dep:cigar-windows-ipc"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
tiktoken-rs = { version = "=0.12.0", optional = true }
rusqlite = { workspace = true, optional = true, features = ["limits"] }
rustix = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
cigar-windows-ipc = { version = "=0.9.4", path = "../cigar-windows-ipc", optional = true, default-features = false }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "cigar-context"
path = "src/main.rs"
required-features = ["bpe"]

[[example]]
name = "compare"
required-features = ["bpe"]

[[bin]]
name = "cigar-context-worker"
path = "src/worker.rs"
required-features = ["bpe"]

[[example]]
name = "source_compare"
required-features = ["bpe"]
