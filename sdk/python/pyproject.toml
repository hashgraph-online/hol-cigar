[project]
name = "hol-cigar"
version = "0.10.1"
description = "CIGAR local Rust context graphs and compatible v1 Python client"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14,<3.15"
dependencies = ["protobuf==6.33.5"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://hol.org"
Repository = "https://github.com/hashgraph-online/hol-cigar"
Issues = "https://github.com/hashgraph-online/hol-cigar/issues"

[project.scripts]
cigar-qualify-bundle = "cigar_sdk.qualify_bundle:main"
cigar-agent-b-handoff = "cigar_sdk.examples.agent_b_handoff:main"

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.3",
  "ruff==0.14.10",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cigar_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/cigar_sdk", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml", "hatch_build.py"]
exclude = ["src/cigar_sdk/_native"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["src/cigar_sdk/generated", "src/cigar_sdk/verify_replay.py", "src/cigar_sdk/verify_vectors.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["src/cigar_sdk/generated", "src/cigar_sdk/verify_replay.py", "src/cigar_sdk/verify_vectors.py"]
