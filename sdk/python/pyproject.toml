[project]
name = "cigar-sdk"
version = "1.0.0-dev.1"
description = "CIGAR v1 Python SDK"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14,<3.15"
dependencies = ["protobuf==6.33.5"]

[project.urls]
Homepage = "https://github.com/CIGAR/cigar"
Repository = "https://github.com/CIGAR/cigar"

[project.scripts]
cigar-qualify-bundle = "cigar_sdk.qualify_bundle:main"

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "ruff==0.14.10",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cigar_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/cigar_sdk", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["src/cigar_sdk/generated", "src/cigar_sdk/verify_replay.py", "src/cigar_sdk/verify_vectors.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["src/cigar_sdk/generated", "src/cigar_sdk/verify_replay.py", "src/cigar_sdk/verify_vectors.py"]
