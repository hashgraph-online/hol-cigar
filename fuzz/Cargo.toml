[package]
name = "cigar-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
cigar-canon = { path = "../crates/cigar-canon" }
cigar-catalog = { path = "../crates/cigar-catalog" }
cigar-code-intel = { path = "../crates/cigar-code-intel" }
cigar-compiler = { path = "../crates/cigar-compiler" }
cigar-effects = { path = "../crates/cigar-effects" }
cigar-extension-host = { path = "../crates/cigar-extension-host" }
cigar-mcp = { path = "../crates/cigar-mcp" }
cigar-policy = { path = "../crates/cigar-policy" }
cigar-protocol = { path = "../crates/cigar-protocol" }
cigar-replay = { path = "../crates/cigar-replay" }
cigar-store = { path = "../crates/cigar-store" }
libfuzzer-sys = "=0.4.13"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"

[[bin]]
name = "canonical_json_cbor"
path = "fuzz_targets/canonical_json_cbor.rs"
test = false
doc = false
bench = false

