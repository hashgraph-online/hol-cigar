services:
  workspace:
    image: rust:1.92-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  postgres:
    image: postgres:18.2-bookworm
    environment:
      POSTGRES_DB: cigar
      POSTGRES_USER: cigar
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cigar -d cigar"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"

  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: cigar-local
      MINIO_ROOT_PASSWORD: cigar-local-development-only
    healthcheck:
      test: [CMD, curl, -f, "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"

