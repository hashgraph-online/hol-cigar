apiVersion: v1
kind: Service
metadata:
  name: cigard
  namespace: cigar-shared
  labels: { app.kubernetes.io/name: cigard, app.kubernetes.io/part-of: cigar }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: cigard }
  ports:
    - { name: https, port: 7443, targetPort: https, protocol: TCP }
    - { name: grpc, port: 7444, targetPort: grpc, protocol: TCP }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cigard
  namespace: cigar-shared
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cigard }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cigard
  namespace: cigar-shared
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: cigard }
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
