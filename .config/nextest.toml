[profile.default]
fail-fast = true
retries = 0
leak-timeout = { period = "2s", result = "fail" }
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
fail-fast = false
retries = 0
leak-timeout = { period = "2s", result = "fail" }
status-level = "fail"
final-status-level = "slow"

[test-groups.cigar-conformance-process]
max-threads = 1

[[profile.default.overrides]]
filter = "package(cigar-conformance)"
test-group = "cigar-conformance-process"
