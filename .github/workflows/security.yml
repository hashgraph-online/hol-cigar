name: security

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      - run: cargo install cargo-audit --version 0.22.1 --locked
      - run: cargo audit --deny warnings
      - run: cargo xtask lint

  static-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.0"
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Scan for committed secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" dir . --no-banner --redact=100 --max-target-megabytes=2 --timeout=120
      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
      - name: Run static application security rules
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.168.0
          semgrep scan --config auto --error --timeout 30 --exclude target --exclude vendor --exclude node_modules --exclude dist --exclude .venv .

  sdk-dependency-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.10.0"
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Audit TypeScript production dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm audit --prod --audit-level high
      - name: Audit Python production dependencies
        run: |
          uv sync --project sdk/python --frozen
          uv export --project sdk/python --no-dev --format requirements-txt --no-emit-project --no-hashes | uvx --from pip-audit==2.10.1 pip-audit --strict --no-deps -r /dev/stdin

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - run: cargo llvm-cov --workspace --all-targets --lcov --output-path reports/lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-coverage
          path: reports/lcov.info
