name: context-native

on:
  push:
    branches: [codex/cigar-0.11.0-distribution]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        builder: [first, second]
        platform: [darwin-arm64, darwin-x64, linux-x64-gnu, linux-arm64-gnu, linux-x64-musl, linux-arm64-musl, win32-x64]
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-x64-gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:ae21cd1c8220f773f9b5934f3b845d677494d4cd4b8981c1e416f654e8afa74e
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:f2c063e4d418c18356490aa38ebd045a8e27a6e3e1f2284dd1fd62da1218789d
          - platform: linux-x64-musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            image: quay.io/pypa/musllinux_1_2_x86_64@sha256:ca10ffd4cf35119f7ed600e3691207291de1cfe7a19bb6d77ec7a1e2784e56b3
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            image: quay.io/pypa/musllinux_1_2_aarch64@sha256:53527fed75a049309c32b698cbf0d7a26af1b8208816d42d0061e57d0f382c6f
          - platform: win32-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CIGAR_PLATFORM: ${{ matrix.platform }}
      CIGAR_TARGET: ${{ matrix.target }}
      CIGAR_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"
      - name: Install exact native Rust compiler
        run: rustup toolchain install "1.92.0-${CIGAR_TARGET}" --profile minimal --force-non-host
      - name: Build and test macOS or Windows worker from the packaged crate
        if: runner.os != 'Linux'
        run: |
          python scripts/release/build_context_worker.py --platform "${CIGAR_PLATFORM}" \
            --cargo "$(rustup which --toolchain "1.92.0-${CIGAR_TARGET}" cargo)" \
            --output "${RUNNER_TEMP}/worker" --target-dir "${RUNNER_TEMP}/worker-target"
      - name: Build and test Linux worker at the declared libc floor
        if: runner.os == 'Linux'
        run: |
          CIGAR_TOOLCHAIN="$(dirname "$(dirname "$(rustup which --toolchain "1.92.0-${CIGAR_TARGET}" cargo)")")"
          docker pull "${CIGAR_IMAGE}"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/src,readonly" \
            --mount "type=bind,src=${CIGAR_TOOLCHAIN},dst=/toolchain,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP},dst=/out" \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/src \
            --env CARGO_HOME=/out/cargo-home \
            --workdir /src "${CIGAR_IMAGE}" \
            /opt/python/cp314-cp314/bin/python scripts/release/build_context_worker.py \
            --platform "${CIGAR_PLATFORM}" --cargo /toolchain/bin/cargo \
            --output /out/worker --target-dir /out/worker-target
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: context-worker-${{ matrix.platform }}-${{ matrix.builder }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            ${{ runner.temp }}/worker/native/
            ${{ runner.temp }}/worker/oracle/
            ${{ runner.temp }}/worker/source/
            ${{ runner.temp }}/worker/logs/
            ${{ runner.temp }}/worker/build.json
            ${{ runner.temp }}/worker/checks.json

# These jobs only build and test. Archive assembly, installed consumers and signed
# publication are separate gates; a successful worker receipt is insufficient.
