name: context-sdk-beta

on:
  push:
    branches: [codex/cigar-0.10.0]
    tags: [v0.10.0-beta.1]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: context-sdk-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  independent-build:
    strategy:
      fail-fast: false
      matrix:
        builder: [first, second]
    uses: ./.github/workflows/context-sdk-rc.yml
    with:
      build-id: ${{ matrix.builder }}

  assemble:
    needs: independent-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: context-sdk-qualified-*
          path: ${{ runner.temp }}/builders
      - name: Require two qualified builds with identical archives and workers
        run: |
          python3 scripts/release/context_sdk_beta.py assemble \
            --first "${RUNNER_TEMP}/builders/context-sdk-qualified-first" \
            --second "${RUNNER_TEMP}/builders/context-sdk-qualified-second" \
            --directory "${RUNNER_TEMP}/beta-release" --commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-sdk-beta-release
          path: ${{ runner.temp }}/beta-release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attest-and-release:
    if: github.repository == 'hashgraph-online/hol-cigar' && github.ref == 'refs/tags/v0.10.0-beta.1'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: context-sdk-beta-release
          path: ${{ runner.temp }}/beta-release/
      - name: Reverify exact assembled bytes before obtaining signatures
        run: |
          test "${GITHUB_REF}" = "refs/tags/v0.10.0-beta.1"
          python3 scripts/release/context_sdk_beta.py verify \
            --directory "${RUNNER_TEMP}/beta-release" --commit "${GITHUB_SHA}"
      - name: Sign public payload provenance using short-lived GitHub OIDC identity
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/beta-release/*
      - name: Verify certificate identity, source tag, source commit, and every signed payload
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          install -m 0400 "${BUNDLE_PATH}" "${RUNNER_TEMP}/beta-release/provenance.sigstore.jsonl"
          python3 scripts/release/context_sdk_beta.py verify --verify-attestations \
            --directory "${RUNNER_TEMP}/beta-release" --commit "${GITHUB_SHA}"
      - name: Create one public prerelease without replacing assets or the latest channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.10.0-beta.1 "${RUNNER_TEMP}/beta-release/"* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --prerelease --latest=false \
            --title "CIGAR 0.10.0 beta 1 — local context core and SDKs" \
            --notes-file "${RUNNER_TEMP}/beta-release/RELEASE_NOTES.md"
      - name: Download public bytes and verify again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.10.0-beta.1 --repo "${GITHUB_REPOSITORY}" --dir "${RUNNER_TEMP}/public-readback"
          python3 scripts/release/context_sdk_beta.py verify --verify-attestations \
            --directory "${RUNNER_TEMP}/public-readback" --commit "${GITHUB_SHA}"
