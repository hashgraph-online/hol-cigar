name: fast-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# This development cohort is intentionally native Apple-silicon only. Fuzz
# accumulation and cigar-soak are mandatory release gates, but are not run here.
jobs:
  source-quality:
    name: source quality / macOS 15 arm64
    runs-on: macos-15
    timeout-minutes: 75
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          architecture: arm64
          cache: false
          check-latest: false
          go-version: "1.26.5"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          architecture: arm64
          check-latest: false
          node-version: "24.10.0"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          architecture: arm64
          check-latest: false
          python-version: "3.14.6"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
          version: "0.11.8"

      - name: Verify the native host and pinned language toolchains
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test "$(rustc --version | awk '{print $2}')" = "1.92.0"
          test "$(cargo --version | awk '{print $2}')" = "1.92.0"
          test "$(rustc --version --verbose | awk '/^host:/ {print $2}')" = "aarch64-apple-darwin"
          test "$(node --version)" = "v24.10.0"
          test "$(python3 -c 'import platform; print(platform.python_version())')" = "3.14.6"
          test "$(go env GOARCH)" = "arm64"
          test "$(go env GOOS)" = "darwin"
          test "$(go version | awk '{print $3}')" = "go1.26.5"
          test "$(uv --version)" = "uv 0.11.8"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          canonical_temp="$(cd "${RUNNER_TEMP}" && pwd -P)"
          printf 'CARGO_TARGET_DIR=%s\n' \
            "${canonical_temp}/cigar-fast-source-target" \
            >>"${GITHUB_ENV}"

      - name: Install pinned generation tools
        run: |
          umask 077
          protoc_root="${RUNNER_TEMP}/protoc-33.2"
          protoc_archive="${RUNNER_TEMP}/protoc-33.2-osx-aarch_64.zip"
          test ! -e "${protoc_root}"
          test ! -e "${protoc_archive}"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --show-error \
            --silent \
            --location \
            --output "${protoc_archive}" \
            https://github.com/protocolbuffers/protobuf/releases/download/v33.2/protoc-33.2-osx-aarch_64.zip
          printf '%s  %s\n' \
            '5be1427127788c9f7dd7d606c3e69843dd3587327dea993917ffcb77e7234b44' \
            "${protoc_archive}" \
            | shasum -a 256 --check
          mkdir -m 0700 "${protoc_root}"
          unzip -q "${protoc_archive}" -d "${protoc_root}"
          test "$("${protoc_root}/bin/protoc" --version)" = "libprotoc 33.2"
          printf '%s\n' "${protoc_root}/bin" >>"${GITHUB_PATH}"
          cargo install protoc-gen-prost --version 0.5.0 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          corepack enable
          corepack install --global pnpm@10.34.5
          test "$(protoc-gen-prost --version)" = "0.5.0"
          test "$(cargo deny --version)" = "cargo-deny 0.20.2"
          test "$(corepack pnpm --version)" = "10.34.5"

      - name: Hydrate locked dependency caches
        run: |
          cargo fetch --locked --target aarch64-apple-darwin
          corepack pnpm install --frozen-lockfile
          uv sync --project sdk/python --frozen
          go -C sdk/go mod download

      - name: Check formatting, generated sources, vectors, and architecture offline
        env:
          CARGO_NET_OFFLINE: "true"
          GONOSUMDB: "*"
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: "local"
          PNPM_CONFIG_OFFLINE: "true"
          UV_OFFLINE: "1"
        run: |
          cargo metadata --locked --offline --format-version 1 >/dev/null
          evidence_parent="$(cd "${RUNNER_TEMP}" && pwd -P)/cigar-fast-command-evidence"
          test ! -e "${evidence_parent}"
          mkdir -m 0700 "${evidence_parent}"
          cargo xtask --evidence-dir "${evidence_parent}/fmt" fmt --check
          cargo xtask --evidence-dir "${evidence_parent}/generate" generate --check
          cargo xtask vectors check
          cargo xtask architecture-check
          cargo xtask --evidence-dir "${evidence_parent}/test-vectors" test vectors

      # The Cargo graph is locked, but cargo-deny intentionally refreshes its advisory
      # database in this diagnostic CI lane. Candidate scans are separately revision-pinned.
      - name: Run the strict lint and dependency-policy matrix
        run: |
          evidence_parent="$(cd "${RUNNER_TEMP}" && pwd -P)/cigar-fast-command-evidence"
          test -d "${evidence_parent}"
          cargo xtask --evidence-dir "${evidence_parent}/lint" lint

      - name: Check documentation offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          evidence_parent="$(cd "${RUNNER_TEMP}" && pwd -P)/cigar-fast-command-evidence"
          test -d "${evidence_parent}"
          cargo xtask --evidence-dir "${evidence_parent}/docs" docs --check

      - name: Assert source checks left the checkout clean
        if: ${{ always() }}
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

  rust-tests:
    name: strict Rust suite / macOS 15 arm64
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NEXTEST_HIDE_PROGRESS_BAR: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Verify the native host and pinned Rust toolchain
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test "$(rustc --version | awk '{print $2}')" = "1.92.0"
          test "$(cargo --version | awk '{print $2}')" = "1.92.0"
          test "$(rustc --version --verbose | awk '/^host:/ {print $2}')" = "aarch64-apple-darwin"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          canonical_temp="$(cd "${RUNNER_TEMP}" && pwd -P)"
          printf 'CARGO_TARGET_DIR=%s\n' \
            "${canonical_temp}/cigar-fast-rust-target" \
            >>"${GITHUB_ENV}"

      - name: Install the pinned test runner
        run: |
          cargo install cargo-nextest --version 0.9.140 --locked
          test "$(cargo nextest --version | awk '{print $2}')" = "0.9.140"

      - name: Hydrate the locked Cargo cache
        run: cargo fetch --locked --target aarch64-apple-darwin

      - name: Run the strict non-soak Rust suite offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo metadata --locked --offline --format-version 1 >/dev/null
          cargo nextest run \
            --locked \
            --workspace \
            --all-targets \
            --exclude cigar-soak \
            --profile macos-qualification

      - name: Assert Rust tests left the checkout clean
        if: ${{ always() }}
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

  main-native-matrices:
    name: merge qualification matrices / macOS 15 arm64
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-15
    timeout-minutes: 180
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NEXTEST_HIDE_PROGRESS_BAR: "1"
      NO_COLOR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          architecture: arm64
          cache: false
          check-latest: false
          go-version: "1.26.5"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          architecture: arm64
          check-latest: false
          node-version: "24.10.0"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          architecture: arm64
          check-latest: false
          python-version: "3.14.6"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
          version: "0.11.8"

      - name: Verify native source and pinned toolchains
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test "$(rustc --version | awk '{print $2}')" = "1.92.0"
          test "$(cargo --version | awk '{print $2}')" = "1.92.0"
          test "$(rustc --version --verbose | awk '/^host:/ {print $2}')" = "aarch64-apple-darwin"
          test "$(node --version)" = "v24.10.0"
          test "$(python3 -c 'import platform; print(platform.python_version())')" = "3.14.6"
          test "$(go env GOOS)" = "darwin"
          test "$(go env GOARCH)" = "arm64"
          test "$(go version | awk '{print $3}')" = "go1.26.5"
          test "$(uv --version)" = "uv 0.11.8"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          canonical_temp="$(cd "${RUNNER_TEMP}" && pwd -P)"
          printf 'CARGO_TARGET_DIR=%s\n' \
            "${canonical_temp}/cigar-main-matrices-target" \
            >>"${GITHUB_ENV}"
          printf 'CIGAR_MAIN_EVIDENCE_PARENT=%s\n' \
            "${canonical_temp}/cigar-main-matrix-evidence" \
            >>"${GITHUB_ENV}"

      - name: Install pinned matrix tools
        run: |
          cargo install cargo-nextest --version 0.9.140 --locked
          corepack enable
          corepack install --global pnpm@10.34.5
          test "$(cargo nextest --version | awk 'NR == 1 {print $2}')" = "0.9.140"
          test "$(corepack pnpm --version)" = "10.34.5"

      - name: Hydrate locked Rust and SDK dependencies
        run: |
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch \
            --manifest-path tests/properties/Cargo.toml \
            --locked \
            --target aarch64-apple-darwin
          corepack pnpm install --frozen-lockfile
          uv sync --project sdk/python --frozen
          go -C sdk/go mod download

      - name: Run all native non-fuzz non-soak merge matrices offline
        env:
          CARGO_NET_OFFLINE: "true"
          GONOSUMDB: "*"
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: "local"
          PNPM_CONFIG_OFFLINE: "true"
          UV_OFFLINE: "1"
        run: |
          evidence_parent="${CIGAR_MAIN_EVIDENCE_PARENT}"
          test ! -e "${evidence_parent}"
          mkdir -m 0700 "${evidence_parent}"
          cargo xtask --evidence-dir "${evidence_parent}/compatibility" test compatibility
          cargo xtask --evidence-dir "${evidence_parent}/integration" test integration
          cargo xtask --evidence-dir "${evidence_parent}/e2e" test e2e
          cargo xtask --evidence-dir "${evidence_parent}/security" test security
          cargo xtask --evidence-dir "${evidence_parent}/offline" test offline
          cargo xtask --evidence-dir "${evidence_parent}/models" test models
          cargo xtask --evidence-dir "${evidence_parent}/chaos" test chaos
          cargo xtask --evidence-dir "${evidence_parent}/migrations" test migrations
          python3 tools/quality/run_matrix.py \
            --matrix tests/installation/matrix-v1.json \
            --profile local \
            --evidence-dir "${evidence_parent}/installation" \
            --require-evidence \
            --isolate-evidence-environment \
            --output result.json

      - name: Preserve content-free merge-matrix receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-main-matrix-receipts
          path: ${{ env.CIGAR_MAIN_EVIDENCE_PARENT }}
          if-no-files-found: error
          include-hidden-files: false

      - name: Assert merge matrices left the checkout clean
        if: ${{ always() }}
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
