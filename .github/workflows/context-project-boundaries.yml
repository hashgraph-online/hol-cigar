name: context-project-boundaries

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/cigar-0.14.0]

permissions:
  contents: read

jobs:
  project-boundaries:
    name: filesystem and deployment boundaries / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # These are correctness checks, not the release performance treatment.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
      - name: Check Rust formatting before native compilation
        run: cargo fmt --all -- --check
      - uses: ./.github/actions/setup-protoc
      - name: Check catalog policy, filesystem admission and frozen protocol
        run: cargo test --locked -p cigar-catalog -p cigar-protocol -- --test-threads=1
      - name: Check catalog and protocol lint contracts
        run: cargo clippy --locked -p cigar-catalog -p cigar-protocol --all-targets -- -D warnings
      - name: Check daemon file reads, bounded worker capacity and deployment assets
        if: runner.os != 'Windows'
        run: cargo test --locked -p cigar-daemon --lib --test deployment_assets -- --test-threads=1
      - name: Check CLI file reads, active-store maintenance and backup boundaries
        if: runner.os != 'Windows'
        run: cargo test --locked -p cigar-cli --lib -- --test-threads=1
      - name: Execute deployment filesystem boundaries on the disposable runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run --locked -p cigar-daemon --example deployment_runtime_fixture > "${RUNNER_TEMP}/cigar-deployment-fixture.json"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3 scripts/release/qualify_deployment_boundaries.py \
            --allow-ephemeral-host-mutations \
            --fixture "${RUNNER_TEMP}/cigar-deployment-fixture.json" \
            --output "${RUNNER_TEMP}/cigar-deployment-runtime.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && runner.os == 'Linux'
        with:
          name: context-deployment-filesystem-runtime
          path: |
            ${{ runner.temp }}/cigar-deployment-fixture.json
            ${{ runner.temp }}/cigar-deployment-runtime.json
          retention-days: 30
      - name: Check source remains clean
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

# This checks source behavior on real host filesystems. It does not advertise
# a Windows daemon deployment or substitute for installed SDK qualification.
