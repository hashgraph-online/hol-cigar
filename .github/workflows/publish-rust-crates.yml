name: publish-rust-crates

# Publishes the Rust context library to crates.io. On every push to main that
# touches either crate, each crate whose version is not on crates.io yet is
# published (hol-cigar-windows-ipc first, since hol-cigar depends on it).
# A manual run with "dry run" packages and checks without publishing.
on:
  push:
    branches: [main]
    paths:
      - crates/cigar-context/**
      - crates/cigar-windows-ipc/**
      - Cargo.lock
      - .github/workflows/publish-rust-crates.yml
  workflow_dispatch:
    inputs:
      mode:
        description: '"dry run" packages and checks only; "publish" publishes unreleased versions'
        required: true
        default: dry run
        type: choice
        options:
          - dry run
          - publish

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: publish-rust-crates
  cancel-in-progress: false

jobs:
  publish:
    name: package and publish hol-cigar-windows-ipc, then hol-cigar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.mode == 'publish' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Find versions not yet on crates.io
        id: pending
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          for crate in hol-cigar-windows-ipc hol-cigar; do
            version=$(jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version' <<<"$metadata")
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'hol-cigar publish workflow (github.com/hashgraph-online/hol-cigar)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200) echo "$crate $version is already published" ;;
              404) echo "$crate $version will be published"; echo "${crate//-/_}=$version" >> "$GITHUB_OUTPUT" ;;
              *) echo "crates.io answered $status for $crate $version" >&2; exit 1 ;;
            esac
          done
      - name: Package (dry run)
        run: |
          cargo publish --locked -p hol-cigar-windows-ipc --dry-run
          cargo package --locked -p hol-cigar --no-verify --list > /dev/null
      - name: Publish hol-cigar-windows-ipc
        if: env.PUBLISH == 'true' && steps.pending.outputs.hol_cigar_windows_ipc != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_KEY }}
        run: cargo publish --locked -p hol-cigar-windows-ipc
      - name: Publish hol-cigar
        if: env.PUBLISH == 'true' && steps.pending.outputs.hol_cigar != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_KEY }}
        run: cargo publish --locked -p hol-cigar
