name: context-sdk-rc

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  native-rc:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 107880a53046b0abf0d5f5f6d9f63598722823e2
          path: .tmp/sdk-094-baseline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.10.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.3"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.6"
          cache: false
      - name: Install pinned source tools
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
          corepack enable
          corepack install --global pnpm@10.34.5
          pnpm install --frozen-lockfile --ignore-scripts
          uv sync --project sdk/python --frozen
          python3 sdk/generate_clients.py --check
          python3 -m unittest scripts.release.tests.test_balanced_compatibility tools.quality.tests.test_pypi_honey_workflow
      - name: Build reproducible RC archives without publication
        run: |
          python3 scripts/release/prepare_context_sdk_rc.py \
            --output "${RUNNER_TEMP}/sdk-rc" \
            --cargo "$(rustup which cargo)" --pnpm "$(command -v pnpm)" \
            --npm "$(command -v npm)" --uv "$(command -v uv)" \
            --target-dir "${RUNNER_TEMP}/sdk-rc-target"
      - name: Qualify clean installs and exact older SDK baseline
        run: |
          python3 scripts/release/qualify_context_sdk_rc.py \
            --release "${RUNNER_TEMP}/sdk-rc" --output "${RUNNER_TEMP}/sdk-rc-checks" \
            --baseline "${GITHUB_WORKSPACE}/.tmp/sdk-094-baseline" \
            --uv "$(command -v uv)" --pnpm "$(command -v pnpm)" --npm "$(command -v npm)" \
            --cli "${RUNNER_TEMP}/sdk-rc-target/release/cigar-context"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: context-sdk-0.10.0-rc.1-macos-arm64
          path: |
            ${{ runner.temp }}/sdk-rc/artifacts
            ${{ runner.temp }}/sdk-rc/release.json
            ${{ runner.temp }}/sdk-rc/logs
            ${{ runner.temp }}/sdk-rc-checks/qualification.json
            ${{ runner.temp }}/sdk-rc-checks/logs

# No registry token, id-token/write permission, publish command, or dist-tag mutation.
