name: context-library-development

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/cigar-0.14.0]

permissions:
  contents: read

jobs:
  evaluation-contract:
    name: offline evaluation contract / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
      - name: Validate evidence binding, pairing, denominators and raw-study import
        run: python -m unittest discover -s benches/context-evaluation -p 'test_*.py'
      - name: Validate packaged native source closure
        run: python -m unittest scripts.release.tests.test_context_native_sources
      - name: Validate diagnostic benchmark reductions
        if: runner.os != 'Windows'
        run: python -m unittest discover -s benchmarks -p 'test_*.py'

  context:
    name: standalone context / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
      - name: Check the Windows storage and legacy named-pipe adapter
        if: runner.os == 'Windows'
        run: |
          cargo clippy --locked -p cigar-windows-ipc --all-targets -- -D warnings
          cargo test --locked -p cigar-windows-ipc
          cargo clippy --locked -p cigar-windows-ipc --all-targets --no-default-features -- -D warnings
          cargo test --locked -p cigar-windows-ipc --no-default-features
      - name: Check source quality, CLI, optional BPE, and core-only consumer
        run: python scripts/dev.py context
      - name: Check offline answer-quality metrics and denominators
        run: python -m unittest discover -s benches/answer-quality -p 'test_*.py'
      - name: Build public API documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p cigar-context --all-features --no-deps
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.10.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.18"
      - name: Build SDKs and test independent broker consumers and crash recovery
        shell: bash
        env:
          CIGAR_ALLOW_PORTABLE_WHEEL: "1"
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          CIGAR_TEST_WORKER: ${{ github.workspace }}/target/debug/${{ runner.os == 'Windows' && 'cigar-context-worker.exe' || 'cigar-context-worker' }}
          CIGAR_TEST_NODE_AGENT: ${{ github.workspace }}/sdk/typescript/dist/tests/broker-agent.js
        run: |
          cargo build --locked -p cigar-context --features bpe,broker-persistence --bin cigar-context-worker
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm --dir sdk/typescript run build
          node --test sdk/typescript/dist/tests/broker*.test.js sdk/typescript/dist/tests/context-effects.test.js sdk/typescript/dist/tests/selection-explanation.test.js sdk/typescript/dist/tests/syntax-ingestion.test.js
          uv sync --project sdk/python --frozen
          uv run --project sdk/python --no-sync python -m pytest -q sdk/python/tests/test_broker*.py sdk/python/tests/test_context_effects.py sdk/python/tests/test_selection_explanation.py sdk/python/tests/test_syntax_ingestion.py sdk/python/tests/test_scoped_retrieval.py
      - name: Qualify independent mixed-client faults on the built SDKs
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv run --project sdk/python --no-sync python benchmarks/broker_load.py \
            --worker "${GITHUB_WORKSPACE}/target/debug/cigar-context-worker" \
            --node "$(command -v node)" \
            --node-sdk "${GITHUB_WORKSPACE}/sdk/typescript/dist" \
            --output "${RUNNER_TEMP}/cigar-broker-fault-qualification" \
            --cohorts 1 --agent-counts 5 12 --runtimes mixed --only-faults
      - name: Retain source broker fault evidence
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: broker-fault-source-${{ matrix.os }}
          path: ${{ runner.temp }}/cigar-broker-fault-qualification
          if-no-files-found: ignore
      - name: Install the pinned compiler for the native Honey integration
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-protoc
      - name: Exercise both SDKs through Honey HTTP and durable terminal outcomes
        if: runner.os == 'macOS'
        shell: bash
        env:
          CIGAR_TEST_WORKER: ${{ github.workspace }}/target/debug/cigar-context-worker
          CIGAR_TEST_CONTEXT_EFFECT_NODE: ${{ github.workspace }}/sdk/typescript/dist/tests/context-effect-consumer.js
        run: |
          CIGAR_TEST_PYTHON="${GITHUB_WORKSPACE}/sdk/python/.venv/bin/python"
          CIGAR_TEST_NODE="$(command -v node)"
          export CIGAR_TEST_PYTHON CIGAR_TEST_NODE
          cargo test --locked -p cigar-daemon --lib checked_context_sdk_honey_terminal_outcomes -- --ignored --nocapture --test-threads=1
      - name: Verify the standalone packages
        run: cargo package --locked -p cigar-windows-ipc -p cigar-context --features cigar-context/bpe,cigar-context/broker-persistence

  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
      - run: python scripts/dev.py compiler

# Source diagnostics only. The separate Honey authority-backed qualification and publication
# workflows remain intact; passing these jobs does not produce a release receipt.
