name: publish-cigar-sdk-honey

on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: SHA-256 of the approved GitHub prerelease manifest
        required: true
        type: string
      confirm:
        description: Type "publish cigar-sdk 0.9.1.dev1"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: publish-cigar-sdk-0.9.1.dev1
  cancel-in-progress: false

jobs:
  verify-release-bytes:
    name: verify exact GitHub prerelease bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          architecture: x64
          check-latest: false
          python-version: "3.14.6"

      - name: Require the approved Honey tag and explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "${GITHUB_REF}" = "refs/tags/v0.9.1-honey.1"
          test "${CONFIRM}" = "publish cigar-sdk 0.9.1.dev1"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 v0.9.1-honey.1)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Download and verify the complete GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          umask 077
          [[ "${MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          release_state="$(
            gh release view v0.9.1-honey.1 \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,isPrerelease,tagName \
              --jq '[.isDraft, .isPrerelease, .tagName] | @tsv'
          )"
          test "${release_state}" = $'false\ttrue\tv0.9.1-honey.1'
          mkdir -m 0700 candidate dist
          gh release download v0.9.1-honey.1 \
            --repo "${GITHUB_REPOSITORY}" \
            --dir candidate
          test "$(find candidate -type f | wc -l | tr -d ' ')" = "13"
          printf '%s  %s\n' \
            "${MANIFEST_SHA256}" \
            candidate/honey-release-manifest.json \
            | sha256sum --check --strict
          python3 scripts/release/verify_honey_release.py candidate
          test "$(
            python3 -c \
              'import json; print(json.load(open("candidate/honey-release-manifest.json"))["source"]["revision"])'
          )" = "$(git rev-parse HEAD)"
          install -m 0400 \
            candidate/cigar_sdk-0.9.1.dev1-py3-none-any.whl \
            dist/cigar_sdk-0.9.1.dev1-py3-none-any.whl
          install -m 0400 \
            candidate/cigar_sdk-0.9.1.dev1.tar.gz \
            dist/cigar_sdk-0.9.1.dev1.tar.gz
          test "$(find dist -type f | wc -l | tr -d ' ')" = "2"

      - name: Run the PyPI metadata compatibility check
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --no-input \
            twine==6.2.0
          python3 -m twine check --strict dist/*

      - name: Stage only the verified PyPI distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cigar-sdk-0.9.1.dev1-pypi
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  publish-to-pypi:
    name: publish approved developer preview to PyPI
    needs: verify-release-bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/cigar-sdk
    permissions:
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cigar-sdk-0.9.1.dev1-pypi
          path: dist/

      - name: Publish with Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist/
          verify-metadata: true
          attestations: true
          skip-existing: false
          print-hash: true
          verbose: true
