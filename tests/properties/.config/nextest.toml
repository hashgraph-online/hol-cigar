[profile.default]
fail-fast = true
retries = 0
leak-timeout = { period = "2s", result = "fail" }
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
fail-fast = false
retries = 0
leak-timeout = { period = "2s", result = "fail" }
status-level = "fail"
final-status-level = "slow"

[profile.macos-qualification]
inherits = "ci"
test-threads = 1

[test-groups.cigar-quality-properties]
max-threads = 1

[[profile.default.overrides]]
filter = "package(cigar-quality-properties)"
test-group = "cigar-quality-properties"
